name: Weather Radar LINE Notification

on:
  schedule:
    # 避開整點（GitHub 排程在整點最容易延遲），時間為 UTC
    - cron: '17 0 * * *'   # 台北 08:17
    - cron: '47 3 * * *'   # 台北 11:47
    - cron: '17 6 * * *'   # 台北 14:17
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  send-weather-radar:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v7

    - name: 🐍 Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: 📦 Install dependencies
      run: pip install -r requirements.txt

    - name: 🎬 Build radar video
      id: build
      run: python main.py build

    - name: 📤 Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: site

    - name: 🌐 Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

    - name: 📱 Push to LINE
      run: python main.py push "${{ steps.deployment.outputs.page_url }}" "${{ steps.build.outputs.name }}"

    - name: ❌ Notify failure
      if: failure()
      env:
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: python main.py notify-failure

    - name: 🔁 Keep schedule alive
      # public repo 60 天無活動會自動停用排程；每次重新啟用以重置閒置計數
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/weather-radar-notification.yml/enable"
