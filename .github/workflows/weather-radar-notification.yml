name: Weather Radar LINE Notification

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 08:00（台北=UTC+8）
    - cron: '0 5 * * *'  # 每天 13:00（台北=UTC+8）

  
  # 手動觸發
  workflow_dispatch:
    inputs:
      send_notification:
        description: 'Send LINE notification'
        required: false
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'

env:
  # 設定時區
  TZ: 'Asia/Taipei'

jobs:
  send-weather-radar:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 📁 Create directories
      run: |
        mkdir -p {temp,images,logs}
        
    - name: 🔍 Check file structure
      run: |
        echo "Repository structure:"
        ls -la
        
    - name: ⚙️ Create environment file
      run: |
        echo "LINE_CHANNEL_ACCESS_TOKEN=${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" > .env
        echo "LINE_CHANNEL_SECRET=${{ secrets.LINE_CHANNEL_SECRET }}" >> .env
        echo "LINE_USER_ID=${{ secrets.LINE_USER_ID }}" >> .env
        
    - name: 🌧️ Run Weather Radar Bot
      if: github.event.inputs.send_notification != 'false'
      run: |
        python main.py
        
    - name: 📊 Upload artifacts (for debugging)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: radar-data-${{ github.run_number }}
        path: |
          images/
          logs/
          *.json
        retention-days: 7
        
    - name: 🧹 Cleanup temporary files
      if: always()
      run: |
        rm -rf temp/*.png || true
        find logs/ -name "*.json" -mtime +7 -delete || true
        
    - name: 📈 Log execution status
      if: always()
      run: |
        echo "Workflow completed at: $(date)"
        echo "Status: ${{ job.status }}"
        if [ -f processing_log.json ]; then
          echo "Processing log:"
          cat processing_log.json
        fi